<svg width="1200" height="170" viewBox="0 0 1200 170" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Impact metrics">
  <defs>
    <linearGradient id="num" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FF7A45"/>
      <stop offset="100%" stop-color="#F7468A"/>
    </linearGradient>
    <linearGradient id="num2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F7468A"/>
      <stop offset="100%" stop-color="#7A5CFF"/>
    </linearGradient>
    <filter id="cardglow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="14" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <g font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif">
    <!-- four cells -->
    <g>
      <rect x="8" y="10" width="284" height="150" rx="18" fill="#0E1320" stroke="#FFFFFF" stroke-opacity="0.06" filter="url(#cardglow)"/>
      <text x="150" y="92" text-anchor="middle" font-size="58" font-weight="800" fill="url(#num)">4+</text>
      <text x="150" y="128" text-anchor="middle" font-size="16" letter-spacing="1" fill="#AEB7C2">Years shipping production iOS</text>
    </g>
    <g>
      <rect x="308" y="10" width="284" height="150" rx="18" fill="#0E1320" stroke="#FFFFFF" stroke-opacity="0.06" filter="url(#cardglow)"/>
      <text x="450" y="92" text-anchor="middle" font-size="58" font-weight="800" fill="url(#num2)">6+</text>
      <text x="450" y="128" text-anchor="middle" font-size="16" letter-spacing="1" fill="#AEB7C2">Languages shipped in prod</text>
    </g>
    <g>
      <rect x="608" y="10" width="284" height="150" rx="18" fill="#0E1320" stroke="#FFFFFF" stroke-opacity="0.06" filter="url(#cardglow)"/>
      <text x="750" y="92" text-anchor="middle" font-size="58" font-weight="800" fill="url(#num)">10+</text>
      <text x="750" y="128" text-anchor="middle" font-size="16" letter-spacing="1" fill="#AEB7C2">SDKs &amp; tools authored</text>
    </g>
    <g>
      <rect x="908" y="10" width="284" height="150" rx="18" fill="#0E1320" stroke="#FFFFFF" stroke-opacity="0.06" filter="url(#cardglow)"/>
      <text x="1050" y="92" text-anchor="middle" font-size="54" font-weight="800" fill="url(#num2)">99.7%</text>
      <text x="1050" y="128" text-anchor="middle" font-size="16" letter-spacing="1" fill="#AEB7C2">Crash-free sessions</text>
    </g>
  </g>
</svg>
