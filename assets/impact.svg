<svg width="1200" height="172" viewBox="0 0 1200 172" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Impact: 4+ years production iOS, 20+ apps shipped, 1M+ users reached, 99.7% crash-free">
  <defs>
    <linearGradient id="g1" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#FF4D4D"/><stop offset="100%" stop-color="#E81E63"/></linearGradient>
    <linearGradient id="g2" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#E81E63"/><stop offset="100%" stop-color="#B5179E"/></linearGradient>
    <linearGradient id="g3" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#B5179E"/><stop offset="100%" stop-color="#7C3AED"/></linearGradient>
    <linearGradient id="g4" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#FF2E55"/><stop offset="100%" stop-color="#7C3AED"/></linearGradient>
    <filter id="cardglow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="6" stdDeviation="16" flood-color="#000000" flood-opacity="0.55"/></filter>
    <clipPath id="c1"><rect x="8"   y="12" width="284" height="150" rx="18"/></clipPath>
    <clipPath id="c2"><rect x="308" y="12" width="284" height="150" rx="18"/></clipPath>
    <clipPath id="c3"><rect x="608" y="12" width="284" height="150" rx="18"/></clipPath>
    <clipPath id="c4"><rect x="908" y="12" width="284" height="150" rx="18"/></clipPath>
  </defs>

  <g font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif">
    <g clip-path="url(#c1)">
      <rect x="8" y="12" width="284" height="150" rx="18" fill="#120F18" stroke="#FFFFFF" stroke-opacity="0.06" filter="url(#cardglow)"/>
      <rect x="8" y="12" width="284" height="4" fill="url(#g1)"/>
      <text x="150" y="94" text-anchor="middle" font-size="58" font-weight="800" fill="url(#g1)">4+</text>
      <text x="150" y="132" text-anchor="middle" font-size="15" letter-spacing="0.3" fill="#AEB7C2">Years shipping production iOS</text>
    </g>
    <g clip-path="url(#c2)">
      <rect x="308" y="12" width="284" height="150" rx="18" fill="#120F18" stroke="#FFFFFF" stroke-opacity="0.06" filter="url(#cardglow)"/>
      <rect x="308" y="12" width="284" height="4" fill="url(#g2)"/>
      <text x="450" y="94" text-anchor="middle" font-size="58" font-weight="800" fill="url(#g2)">20+</text>
      <text x="450" y="132" text-anchor="middle" font-size="15" letter-spacing="0.3" fill="#AEB7C2">Apps shipped to production</text>
    </g>
    <g clip-path="url(#c3)">
      <rect x="608" y="12" width="284" height="150" rx="18" fill="#120F18" stroke="#FFFFFF" stroke-opacity="0.06" filter="url(#cardglow)"/>
      <rect x="608" y="12" width="284" height="4" fill="url(#g3)"/>
      <text x="750" y="94" text-anchor="middle" font-size="56" font-weight="800" fill="url(#g3)">1M+</text>
      <text x="750" y="132" text-anchor="middle" font-size="15" letter-spacing="0.3" fill="#AEB7C2">Users reached worldwide</text>
    </g>
    <g clip-path="url(#c4)">
      <rect x="908" y="12" width="284" height="150" rx="18" fill="#120F18" stroke="#FFFFFF" stroke-opacity="0.06" filter="url(#cardglow)"/>
      <rect x="908" y="12" width="284" height="4" fill="url(#g4)"/>
      <text x="1050" y="93" text-anchor="middle" font-size="54" font-weight="800" fill="url(#g4)">99.7%</text>
      <text x="1050" y="132" text-anchor="middle" font-size="15" letter-spacing="0.3" fill="#AEB7C2">Crash-free at scale</text>
    </g>
  </g>
</svg>
