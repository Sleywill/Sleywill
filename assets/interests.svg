<svg width="1200" height="100" viewBox="0 0 1200 100" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Interests: Warhammer 40K, 3D Printing, Video Games, Death Metal, Hardcore Punk">
  <defs>
    <filter id="ig" x="-40%" y="-40%" width="180%" height="180%"><feDropShadow dx="0" dy="4" stdDeviation="10" flood-color="#000000" flood-opacity="0.5"/></filter>
  </defs>
  <style>
    .lbl{font-family:'Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif;font-size:15px;font-weight:600;}
    .ico{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}
  </style>

  <!-- chip 1 — Warhammer 40K (skull) -->
  <g transform="translate(0,0)">
    <rect x="0" y="12" width="228" height="76" rx="16" fill="#120F18" stroke="#FF2E55" stroke-opacity="0.38" filter="url(#ig)"/>
    <g stroke="#FF2E55" class="ico">
      <circle cx="38" cy="48" r="12"/>
      <rect x="33" y="57" width="10" height="6" rx="2"/>
    </g>
    <circle cx="33" cy="47" r="2.7" fill="#FF2E55"/>
    <circle cx="43" cy="47" r="2.7" fill="#FF2E55"/>
    <path d="M38 51 l-2 4 h4 z" fill="#FF2E55"/>
    <line x1="36" y1="58" x2="36" y2="63" stroke="#FF2E55" stroke-width="1.4"/>
    <line x1="40" y1="58" x2="40" y2="63" stroke="#FF2E55" stroke-width="1.4"/>
    <text x="66" y="55" class="lbl" fill="#E4E9F0">Warhammer 40K</text>
  </g>

  <!-- chip 2 — 3D Printing (cube) -->
  <g transform="translate(243,0)">
    <rect x="0" y="12" width="228" height="76" rx="16" fill="#120F18" stroke="#3FD0C9" stroke-opacity="0.38" filter="url(#ig)"/>
    <g stroke="#3FD0C9" class="ico">
      <path d="M38 36 L50 43 L50 57 L38 64 L26 57 L26 43 Z"/>
      <path d="M38 36 L38 50 M38 50 L50 43 M38 50 L26 43"/>
    </g>
    <text x="66" y="55" class="lbl" fill="#E4E9F0">3D Printing</text>
  </g>

  <!-- chip 3 — Video Games (gamepad) -->
  <g transform="translate(486,0)">
    <rect x="0" y="12" width="228" height="76" rx="16" fill="#120F18" stroke="#7C3AED" stroke-opacity="0.40" filter="url(#ig)"/>
    <g stroke="#9B6BFF" class="ico">
      <rect x="24" y="44" width="28" height="14" rx="7"/>
      <path d="M31 48 L31 54 M28 51 L34 51"/>
    </g>
    <circle cx="45" cy="49" r="1.7" fill="#9B6BFF"/>
    <circle cx="48" cy="53" r="1.7" fill="#9B6BFF"/>
    <text x="66" y="55" class="lbl" fill="#E4E9F0">Video Games</text>
  </g>

  <!-- chip 4 — Death Metal (guitar pick) -->
  <g transform="translate(729,0)">
    <rect x="0" y="12" width="228" height="76" rx="16" fill="#120F18" stroke="#E81E63" stroke-opacity="0.40" filter="url(#ig)"/>
    <path d="M27 45 Q38 39 49 45 Q50 54 38 63 Q26 54 27 45 Z" fill="none" stroke="#E81E63" stroke-width="2" stroke-linejoin="round"/>
    <text x="66" y="55" class="lbl" fill="#E4E9F0">Death Metal</text>
  </g>

  <!-- chip 5 — Hardcore Punk (star) -->
  <g transform="translate(972,0)">
    <rect x="0" y="12" width="228" height="76" rx="16" fill="#120F18" stroke="#FF4D4D" stroke-opacity="0.40" filter="url(#ig)"/>
    <path d="M38 37 L41.1 45.8 L50.4 46.0 L43.0 51.6 L45.6 60.5 L38 55.2 L30.4 60.5 L33.1 51.6 L25.6 46.0 L34.9 45.8 Z"
          fill="none" stroke="#FF4D4D" stroke-width="2" stroke-linejoin="round"/>
    <text x="66" y="55" class="lbl" fill="#E4E9F0">Hardcore Punk</text>
  </g>
</svg>
